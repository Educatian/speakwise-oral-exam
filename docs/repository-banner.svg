        <rect width="480" height="156" rx="22" fill="#020617" fill-opacity="0.74" stroke="rgba(255,255,255,0.1)"/>
        <text x="22" y="30" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Institution Deployment</text>
        <text x="22" y="60" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18">Templates, annotations, review workflows, and institution-scoped operations.</text>

        <g transform="translate(22 92)">
          <rect width="134" height="36" rx="18" fill="#0F172A" stroke="rgba(52,211,153,0.35)"/>
          <text x="25" y="23" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Course Templates</text>
        </g>

        <g transform="translate(172 92)">
          <rect width="122" height="36" rx="18" fill="#0F172A" stroke="rgba(129,140,248,0.35)"/>
          <text x="23" y="23" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Annotations</text>
        </g>

        <g transform="translate(310 92)">
          <rect width="120" height="36" rx="18" fill="#0F172A" stroke="rgba(34,211,238,0.35)"/>
          <text x="28" y="23" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Audit Logs</text>
        </g>
