        <text x="22" y="30" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Live Interview</text>
        <rect x="22" y="54" width="192" height="10" rx="5" fill="#1E293B"/>
        <rect x="22" y="54" width="124" height="10" rx="5" fill="#34D399"/>
        <rect x="22" y="78" width="164" height="12" rx="6" fill="#0F172A" stroke="rgba(52,211,153,0.35)"/>
        <rect x="22" y="102" width="128" height="12" rx="6" fill="#0F172A" stroke="rgba(129,140,248,0.35)"/>
      </g>

      <g transform="translate(254 46)">
        <rect width="226" height="140" rx="22" fill="#020617" fill-opacity="0.74" stroke="rgba(255,255,255,0.1)"/>
        <text x="22" y="30" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Concept Map</text>
        <circle cx="82" cy="88" r="18" fill="#0F172A" stroke="#34D399"/>
        <circle cx="144" cy="64" r="14" fill="#0F172A" stroke="#818CF8"/>
        <circle cx="164" cy="114" r="16" fill="#0F172A" stroke="#22D3EE"/>
        <path d="M98 81L130 69" stroke="#64748B" stroke-width="2"/>
        <path d="M95 98L146 108" stroke="#64748B" stroke-width="2"/>
