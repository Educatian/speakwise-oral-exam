      <rect width="182" height="86" rx="18" fill="#020617" fill-opacity="0.72" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="28" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORKFLOWS</text>
      <text x="20" y="58" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Student</text>
      <text x="20" y="76" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13">Interview and reflection</text>
    </g>

    <g transform="translate(332 382)">
      <rect width="182" height="86" rx="18" fill="#020617" fill-opacity="0.72" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="28" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">REVIEW</text>
      <text x="20" y="58" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Instructor</text>
      <text x="20" y="76" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13">Annotations and override</text>
    </g>

    <g transform="translate(536 382)">
      <rect width="182" height="86" rx="18" fill="#020617" fill-opacity="0.72" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="28" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">OPERATIONS</text>
      <text x="20" y="58" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Admin</text>
      <text x="20" y="76" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="13">Institutions and audit logs</text>
    </g>
