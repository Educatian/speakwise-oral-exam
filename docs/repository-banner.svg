<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SpeakWise repository banner</title>
  <desc id="desc">SpeakWise — institution-ready AI oral examination with reasoning analytics and a radial argument concept map.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="48" x2="1454" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.56" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 132) rotate(130) scale(380 345)">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(316 514) rotate(-25) scale(431 314)">
      <stop stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#glowA)"/>
  <rect width="1600" height="640" fill="url(#glowB)"/>

  <g opacity="0.20">
    <path d="M0 136H1600" stroke="#64748B"/><path d="M0 264H1600" stroke="#64748B"/>
    <path d="M0 392H1600" stroke="#64748B"/><path d="M0 520H1600" stroke="#64748B"/>
    <path d="M216 0V640" stroke="#64748B"/><path d="M472 0V640" stroke="#64748B"/>
    <path d="M728 0V640" stroke="#64748B"/><path d="M984 0V640" stroke="#64748B"/><path d="M1240 0V640" stroke="#64748B"/>
  </g>
  <circle cx="1180" cy="132" r="76" fill="#22D3EE" opacity="0.2" filter="url(#blur)"/>
  <circle cx="1276" cy="458" r="88" fill="#10B981" opacity="0.14" filter="url(#blur)"/>

  <!-- ───────── Left: brand + features ───────── -->
  <g>
    <rect x="96" y="84" width="742" height="470" rx="28" fill="#0F172A" fill-opacity="0.58" stroke="url(#cardStroke)" stroke-width="1.5"/>
    <rect x="128" y="116" width="156" height="34" rx="17" fill="#111827" stroke="rgba(255,255,255,0.12)"/>
    <text x="151" y="138" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">INSTITUTION READY</text>

    <text x="128" y="224" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="800">SpeakWise</text>
    <circle cx="540" cy="200" r="9" fill="url(#accent)"/>

    <text x="128" y="278" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500">AI oral examination with real-time reasoning analytics,</text>
    <text x="128" y="312" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500">a radial argument map, and institution-scoped access.</text>

    <!-- feature chips: 2 rows x 3 -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">
      <g transform="translate(128 352)"><rect width="226" height="46" rx="14" fill="#020617" fill-opacity="0.7" stroke="rgba(52,211,153,0.4)"/><text x="18" y="28" fill="#A7F3D0">Supabase Auth + RLS isolation</text></g>
      <g transform="translate(366 352)"><rect width="186" height="46" rx="14" fill="#020617" fill-opacity="0.7" stroke="rgba(129,140,248,0.4)"/><text x="18" y="28" fill="#C7D2FE">Reasoning rubric</text></g>
      <g transform="translate(564 352)"><rect width="206" height="46" rx="14" fill="#020617" fill-opacity="0.7" stroke="rgba(34,211,238,0.4)"/><text x="18" y="28" fill="#BAE6FD">Radial concept map</text></g>

      <g transform="translate(128 410)"><rect width="246" height="46" rx="14" fill="#020617" fill-opacity="0.7" stroke="rgba(251,191,36,0.4)"/><text x="18" y="28" fill="#FDE68A">Cohort analytics + CSV export</text></g>
      <g transform="translate(386 410)"><rect width="214" height="46" rx="14" fill="#020617" fill-opacity="0.7" stroke="rgba(251,113,133,0.4)"/><text x="18" y="28" fill="#FDA4AF">Human review + override</text></g>
      <g transform="translate(612 410)"><rect width="158" height="46" rx="14" fill="#020617" fill-opacity="0.7" stroke="rgba(255,255,255,0.16)"/><text x="18" y="28" fill="#E2E8F0">Toulmin map</text></g>
    </g>

    <!-- workflow row -->
    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(128 478)"><text x="0" y="14" fill="#64748B" font-size="12" font-weight="700" letter-spacing="2">WORKFLOWS</text>
        <text x="0" y="44" fill="white" font-size="20" font-weight="800">Student<tspan fill="#475569" font-weight="500">  ·  </tspan><tspan fill="white">Instructor</tspan><tspan fill="#475569" font-weight="500">  ·  </tspan><tspan fill="white">Admin</tspan></text>
      </g>
    </g>
  </g>

  <!-- ───────── Right: radial concept map ───────── -->
  <g transform="translate(942 96)">
    <rect width="556" height="448" rx="30" fill="#0B1120" fill-opacity="0.66" stroke="url(#cardStroke)" stroke-width="1.5"/>
    <text x="38" y="54" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">REASONING CONCEPT MAP · RADIAL</text>

    <!-- edge legend -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#94A3B8" transform="translate(38 74)">
      <line x1="0" y1="6" x2="20" y2="6" stroke="#34D399" stroke-width="3"/><text x="26" y="10">Supports</text>
      <line x1="104" y1="6" x2="124" y2="6" stroke="#FBBF24" stroke-width="3"/><text x="130" y="10">Causal</text>
      <line x1="196" y1="6" x2="216" y2="6" stroke="#FB7185" stroke-width="3" stroke-dasharray="5 4"/><text x="222" y="10">Counter</text>
      <line x1="300" y1="6" x2="320" y2="6" stroke="#60A5FA" stroke-width="3"/><text x="326" y="10">Responds</text>
      <line x1="410" y1="6" x2="430" y2="6" stroke="#64748B" stroke-width="3"/><text x="436" y="10">Relates</text>
    </g>

    <!-- edges (hub at 278,266) -->
    <g stroke-width="3" fill="none">
      <path d="M278 266 Q205 215 150 172" stroke="#34D399"/>           <!-- supports → Evidence -->
      <path d="M278 266 Q360 210 420 168" stroke="#FBBF24"/>           <!-- causal → Warrant -->
      <path d="M278 266 Q380 280 452 300" stroke="#FB7185" stroke-dasharray="6 4"/> <!-- counter → Counter -->
      <path d="M278 266 Q268 330 256 392" stroke="#60A5FA"/>           <!-- responds → Question -->
      <path d="M278 266 Q190 296 120 330" stroke="#34D399"/>           <!-- supports → Evidence2 -->
      <path d="M150 172 Q110 226 120 330" stroke="#64748B" stroke-width="2"/> <!-- relates -->
    </g>

    <!-- nodes -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
      <!-- Claim hub (large, central) -->
      <rect x="210" y="244" width="136" height="46" rx="13" fill="#2b0f14" stroke="#F87171" stroke-width="2"/>
      <text x="278" y="272" fill="#FECACA" font-size="17">Claim</text>

      <!-- Evidence (cited → gold ring) -->
      <rect x="93" y="151" width="114" height="40" rx="12" fill="#052118" stroke="#34D399" stroke-width="2"/>
      <rect x="88" y="146" width="124" height="50" rx="15" fill="none" stroke="#FCD34D" stroke-width="1.75"/>
      <text x="150" y="176" fill="#D1FAE5" font-size="15">Evidence</text>

      <!-- Warrant -->
      <rect x="363" y="148" width="114" height="40" rx="12" fill="#2a1d05" stroke="#FBBF24" stroke-width="2"/>
      <text x="420" y="173" fill="#FDE68A" font-size="15">Warrant</text>

      <!-- Counter (rebuttal) -->
      <rect x="397" y="280" width="118" height="40" rx="12" fill="#1e1333" stroke="#A78BFA" stroke-width="2"/>
      <text x="456" y="305" fill="#DDD6FE" font-size="15">Rebuttal</text>

      <!-- Question -->
      <rect x="199" y="372" width="114" height="40" rx="12" fill="#0f1b31" stroke="#60A5FA" stroke-width="2"/>
      <text x="256" y="397" fill="#DBEAFE" font-size="15">Question</text>

      <!-- Evidence2 -->
      <rect x="63" y="310" width="114" height="40" rx="12" fill="#052118" stroke="#34D399" stroke-width="2"/>
      <text x="120" y="335" fill="#D1FAE5" font-size="15">Evidence</text>
    </g>

    <!-- caption -->
    <text x="38" y="430" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="13">Concentric by reasoning depth · node size by centrality · gold ring = cited in score</text>
  </g>
</svg>
