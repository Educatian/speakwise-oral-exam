<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SpeakWise repository banner</title>
  <desc id="desc">A scientific and ambient product banner for the SpeakWise institution-ready oral assessment platform.</desc>
  <defs>
    <linearGradient id="bg" x1="128" y1="48" x2="1454" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.56" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 132) rotate(130.073) scale(380.301 344.967)">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(316 514) rotate(-24.891) scale(430.958 313.948)">
      <stop stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="640" fill="url(#glowA)"/>
  <rect x="0" y="0" width="1600" height="640" fill="url(#glowB)"/>

  <g opacity="0.22">
    <path d="M0 136H1600" stroke="#64748B" stroke-width="1"/>
    <path d="M0 264H1600" stroke="#64748B" stroke-width="1"/>
    <path d="M0 392H1600" stroke="#64748B" stroke-width="1"/>
    <path d="M0 520H1600" stroke="#64748B" stroke-width="1"/>
    <path d="M216 0V640" stroke="#64748B" stroke-width="1"/>
    <path d="M472 0V640" stroke="#64748B" stroke-width="1"/>
    <path d="M728 0V640" stroke="#64748B" stroke-width="1"/>
    <path d="M984 0V640" stroke="#64748B" stroke-width="1"/>
    <path d="M1240 0V640" stroke="#64748B" stroke-width="1"/>
  </g>

  <g opacity="0.12">
    <circle cx="1188" cy="188" r="146" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="1188" cy="188" r="216" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="8 10"/>
    <circle cx="1268" cy="420" r="90" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 9"/>
  </g>

  <circle cx="1180" cy="132" r="76" fill="#22D3EE" opacity="0.22" filter="url(#blur)"/>
  <circle cx="1276" cy="458" r="88" fill="#10B981" opacity="0.16" filter="url(#blur)"/>

