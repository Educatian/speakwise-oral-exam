# Supabase CLI config — see https://supabase.com/docs/guides/cli/config
# Run `npx supabase link --project-ref <your-ref>` once to bind to the hosted project.
project_id = "speakwise"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.evaluate]
verify_jwt = true

[functions.gemini-live-token]
verify_jwt = true

[functions.submit-exam]
verify_jwt = true

[functions.course-login]
verify_jwt = true

[functions.instructor-gemini]
verify_jwt = true

[functions.recording-upload-url]
verify_jwt = true
